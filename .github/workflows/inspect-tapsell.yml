name: Inspect Tapsell API

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Resolve dependencies
        run: |
          gradle :app:dependencies \
            --configuration debugCompileClasspath \
            --no-daemon

      - name: Find Tapsell AAR
        shell: bash
        run: |
          set -e

          echo "=== Searching Tapsell Plus AAR ==="

          AAR=$(find "$HOME/.gradle/caches" \
            -type f \
            -name "tapsell-plus-sdk-android-2.3.3.aar" \
            | head -n 1)

          if [ -z "$AAR" ]; then
            echo "ERROR: Tapsell AAR not found."
            exit 1
          fi

          echo "FOUND:"
          echo "$AAR"

          mkdir -p /tmp/tapsell

          unzip -p "$AAR" classes.jar > /tmp/tapsell/classes.jar

          echo
          echo "=== AdShowListener class ==="

          jar tf /tmp/tapsell/classes.jar \
            | grep "AdShowListener.class" \
            || true

          CLASS=$(jar tf /tmp/tapsell/classes.jar \
            | grep "AdShowListener.class" \
            | head -n 1 \
            | sed 's#/#.#g' \
            | sed 's/\.class$//')

          if [ -z "$CLASS" ]; then
            echo "ERROR: AdShowListener was not found."
            exit 1
          fi

          echo
          echo "CLASS:"
          echo "$CLASS"

          echo
          echo "========================================"
          echo "AdShowListener EXACT API"
          echo "========================================"

          javap \
            -classpath /tmp/tapsell/classes.jar \
            -p \
            -s \
            "$CLASS"

          echo
          echo "========================================"
          echo "TapsellPlus SHOW METHODS"
          echo "========================================"

          javap \
            -classpath /tmp/tapsell/classes.jar \
            -p \
            -s \
            ir.tapsell.plus.TapsellPlus \
            | grep -A 12 -B 3 \
            -E "showInterstitialAd|showRewardedVideoAd"

          echo
          echo "========================================"
          echo "Tapsell API inspection finished"
          echo "========================================"
