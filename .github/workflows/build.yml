name: Build Vidora Player

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare release keystore
        env:
          VIDORA_KEYSTORE_BASE64: ${{ secrets.VIDORA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$VIDORA_KEYSTORE_BASE64" ]; then
            echo "Release keystore secret is not configured."
            exit 1
          fi

          echo "$VIDORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vidora-release.jks"

          if [ ! -s "$RUNNER_TEMP/vidora-release.jks" ]; then
            echo "Release keystore could not be created."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        env:
          VIDORA_KEYSTORE_PATH: ${{ runner.temp }}/vidora-release.jks
          VIDORA_KEYSTORE_PASSWORD: ${{ secrets.VIDORA_KEYSTORE_PASSWORD }}
          VIDORA_KEY_ALIAS: ${{ secrets.VIDORA_KEY_ALIAS }}
          VIDORA_KEY_PASSWORD: ${{ secrets.VIDORA_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon

      - name: Build Release AAB
        env:
          VIDORA_KEYSTORE_PATH: ${{ runner.temp }}/vidora-release.jks
          VIDORA_KEYSTORE_PASSWORD: ${{ secrets.VIDORA_KEYSTORE_PASSWORD }}
          VIDORA_KEY_ALIAS: ${{ secrets.VIDORA_KEY_ALIAS }}
          VIDORA_KEY_PASSWORD: ${{ secrets.VIDORA_KEY_PASSWORD }}
        run: |
          gradle bundleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VidoraPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VidoraPlayer-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: VidoraPlayer-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
