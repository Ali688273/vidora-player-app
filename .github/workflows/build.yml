name: Inspect Tapsell SDK

on:
  workflow_dispatch:

jobs:
  inspect-tapsell:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download dependencies
        run: gradle :app:dependencies --configuration debugCompileClasspath --no-daemon

      - name: Locate Tapsell Plus SDK
        run: |
          echo "Searching Gradle cache for Tapsell Plus SDK..."
          find ~/.gradle/caches -type f \
            \( -name "*tapsell-plus-sdk-android*2.3.3*.aar" \
            -o -name "*tapsell-plus-sdk-android*2.3.3*.jar" \) \
            -print

      - name: Inspect Tapsell SDK classes
        shell: bash
        run: |
          set -e

          AAR=$(find ~/.gradle/caches -type f \
            -name "tapsell-plus-sdk-android-2.3.3.aar" | head -n 1)

          if [ -z "$AAR" ]; then
            echo "Tapsell Plus AAR not found."
            exit 1
          fi

          echo "AAR:"
          echo "$AAR"

          rm -rf /tmp/tapsell-inspect
          mkdir -p /tmp/tapsell-inspect

          unzip -o "$AAR" classes.jar -d /tmp/tapsell-inspect

          echo ""
          echo "===== TapsellPlus classes ====="

          jar tf /tmp/tapsell-inspect/classes.jar \
            | grep -i "TapsellPlus" \
            | head -100

          echo ""
          echo "===== AdShowListener classes ====="

          jar tf /tmp/tapsell-inspect/classes.jar \
            | grep -i "AdShowListener" \
            | head -50

          echo ""
          echo "===== TapsellPlus API ====="

          javap -classpath /tmp/tapsell-inspect/classes.jar \
            -public \
            ir.tapsell.plus.TapsellPlus || true

          echo ""
          echo "===== AdShowListener API ====="

          LISTENER_CLASS=$(jar tf /tmp/tapsell-inspect/classes.jar \
            | grep -i "AdShowListener.class" \
            | head -n 1 \
            | sed 's#/#.#g' \
            | sed 's/\.class$//')

          if [ -n "$LISTENER_CLASS" ]; then
            echo "Listener class: $LISTENER_CLASS"

            javap -classpath /tmp/tapsell-inspect/classes.jar \
              -public \
              "$LISTENER_CLASS" || true
          else
            echo "AdShowListener class was not found."
          fi
