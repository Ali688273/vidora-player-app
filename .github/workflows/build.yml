name: Build Vidora Player

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VidoraPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Check Release Signing Secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] &&
             [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not fully configured."
            echo "Debug build will continue normally."
          fi

      - name: Prepare Release Keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vidora-release.jks"

          if [ ! -s "$RUNNER_TEMP/vidora-release.jks" ]; then
            echo "Release keystore could not be created."
            exit 1
          fi

      - name: Verify Release Keystore Credentials
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Checking keystore type and alias..."

          keytool -list \
            -keystore "$RUNNER_TEMP/vidora-release.jks" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            >/dev/null

          echo "Keystore, alias, and private-key credentials verified successfully."

      - name: Build Release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          VIDORA_KEYSTORE_PATH: ${{ runner.temp }}/vidora-release.jks
          VIDORA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VIDORA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VIDORA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon

      - name: Build Release AAB
        if: steps.signing.outputs.configured == 'true'
        env:
          VIDORA_KEYSTORE_PATH: ${{ runner.temp }}/vidora-release.jks
          VIDORA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VIDORA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VIDORA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle bundleRelease --no-daemon

      - name: Upload Release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VidoraPlayer-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VidoraPlayer-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
